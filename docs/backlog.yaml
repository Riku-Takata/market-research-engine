- id: T-010
  title: ResearchQuery と計画の型
  milestone: M0
  request: '詳細設計の「F-30」「F-31」による。`domain/research.py` に置く。ReadPolicy(StrEnum):cached_only、refresh_if_stale、prefer_live。ResearchQuery{question:
