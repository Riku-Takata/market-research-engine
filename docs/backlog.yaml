schema_version: '1.0'
product: market-research-engine
milestones:
- id: M0
  title: 基盤
  goal: Stage 0(uv sync --locked、ruff、mypy --strict、pytest、uv build、CLI --help、doctor)が
    CI で回る。ドメイン型、Port、設定、SQLite ストア、Fake LLM がそろい、`market-research doctor`、`sources
    list`、`db stats` が動く。
- id: M1
  title: 収集
  goal: '`market-research collect --profile lite` で HN と GitHub から収集し、SQLite に冪等に保存できる。予算を超えたら
    partial になり、`--resume` で続きを取れる。`job status` で run と coverage を辿れる。'
- id: M2
  title: 分析
  goal: '`analyze trends` で Topic 抽出(hybrid/rule)、課題の抽出、7日/30日の Feature、snapshot の公開ができる。`report
    weekly` で TrendReport を JSON と markdown で表示できる。'
- id: M3
  title: 研究
  goal: '`ask` が計画、FTS 検索、Fact 化、LLM 回答、検証を経て、出典付きの ResearchResult を返す。`ask --fixture
    demo` がネットワークなしで CI で通る。文書と live smoke がそろう。'
tasks:
- id: T-001
  title: プロジェクトの雛形と CI
  milestone: M0
  request: '詳細設計の「F-00」「構成」「Stage 0」による。作るもの:`pyproject.toml`(配布名 market-research-engine、requires-python
    >=3.12、ビルドは hatchling。実行時の依存は pydantic、httpx、pyyaml の3つだけ。開発用の依存は ruff、mypy、pytest、pytest-asyncio。console
    script は `market-research = market_research_engine.interfaces.cli.main:main`)、`uv.lock`、`.python-version`(3.12)、`LICENSE`(Apache-2.0
    の全文)、`src/market_research_engine/__init__.py`、`py.typed`、`interfaces/__init__.py`、`interfaces/cli/__init__.py`、`interfaces/cli/main.py`(argparse
    で prog=market-research。今は --help だけ。`main(argv: list[str] | None = None) -> int`)。ruff、mypy(strict、pydantic.mypy
    プラグイン)、pytest(マーカー unit/contract/integration/live を登録、asyncio_mode=auto、addopts
    で live を既定で除く)の設定は pyproject に置く。`tests/unit/test_smoke.py` を置く。`.github/workflows/ci.yml`:PR
    と main への push で、ubuntu-latest × Python 3.12/3.13 の matrix で回す。最初の手順で sqlite3.sqlite_version
    を出力し、`:memory:` に fts5 の trigram 仮想表を作れなければ失敗させる。続けて Stage 0 のうち doctor 以外を実行する(doctor
    は T-025 で足す)。'
  acceptance:
  - '`uv sync --locked`、`uv run ruff check .`、`uv run ruff format --check .`、`uv run
    mypy --strict src tests` がすべて成功する'
  - '`uv run pytest` が成功し、live マーカーの付いたテストは既定では実行されない'
  - '`uv build` で sdist と wheel ができ、wheel に `market_research_engine/py.typed` が含まれる'
  - '`uv run market-research --help` が終了コード 0 で終わる'
  - pyproject の実行時の依存が pydantic、httpx、pyyaml の3つだけである
  - '`.github/workflows/ci.yml` に Python 3.12/3.13 の matrix と、SQLite trigram を確かめる手順がある'
  depends_on: []
  size: M
  human_check: ''
  status: todo
- id: T-002
  title: ドメインの基礎(時刻、ID、エラー、基底モデル)
  milestone: M0
  request: '詳細設計の「F-01」「時刻と ID」による。`domain/__init__.py` と次のモジュールを作る。(1) `domain/time.py`:`ensure_utc(dt:
    datetime) -> datetime`(tzinfo がなければ ValueError。あれば UTC に変換する)、`format_ts(dt) ->
    str`(固定長の `YYYY-MM-DDTHH:MM:SS.ffffffZ`)、`parse_ts(s: str) -> datetime`(format_ts
    の逆。aware な UTC を返す)。(2) `domain/base.py`:`DomainModel`(pydantic BaseModel。ConfigDict
    は frozen=True、extra=forbid)、`UtcDatetime`(tzinfo のない値を拒否し、UTC に直す Annotated 型)。(3)
    `domain/ids.py`:`deterministic_id(prefix: str, *parts: str) -> str` は、parts を
    NUL 文字でつないだ文字列の sha256 の先頭 24 hex に `{prefix}_` を付けたもの。`random_id(prefix: str)
    -> str` は `{prefix}_` + uuid4().hex。(4) `domain/errors.py`:`ErrorCode`(StrEnum。invalid_input、config_error、capability_unsupported、source_unavailable、rate_limited、source_timeout、llm_unavailable、llm_schema_invalid、storage_error、storage_schema_newer、budget_exceeded、job_not_found、internal_error
    の 13 個)、`ErrorInfo`(DomainModel{code: ErrorCode, message: str, context: dict[str,
    JsonValue]})、`MREError(Exception)`(属性 code、message、context。`to_info() -> ErrorInfo`。str()
    は message を含む)。'
  acceptance:
  - '`format_ts(datetime(2026,10,1,tzinfo=UTC))` が `2026-10-01T00:00:00.000000Z` になり、parse_ts
    で元の値に戻る'
  - JST の aware な datetime を ensure_utc に渡すと UTC に変換され、naive な datetime は ValueError
    になる
  - UtcDatetime のフィールドを持つ DomainModel に naive な datetime を渡すと pydantic.ValidationError
    になる
  - deterministic_id は同じ引数で同じ値を返し、`^{prefix}_[0-9a-f]{24}$` の形になる
  - ErrorCode の値がちょうど 13 個である
  - MREError の to_info() の結果が model_dump_json → model_validate_json で一致する
  depends_on:
  - T-001
  size: S
  human_check: ''
  status: todo
- id: T-003
  title: パッケージの骨組みと import 境界の検査
  milestone: M0
  request: '詳細設計の「依存の向き」による。空のサブパッケージ(`__init__.py` だけ)を作る:ports、application、analytics、indexing、adapters、adapters/sources、adapters/storage、adapters/storage/sqlite、adapters/search、adapters/llm。`scripts/check_imports.py`
    に `find_violations(package_root: Path) -> list[str]` と CLI を置く。CLI は `python scripts/check_imports.py
    PATH` で、違反があれば `{package_root からの相対パス}: {import 名}` を1行ずつ出して終了コード 1、なければ 0 で終わる。ast
    で import と from-import を集め(相対 import は絶対名に直す)、次の規則で判定する。domain は標準ライブラリ(sys.stdlib_module_names)と
    pydantic だけを import する。ports と config はパッケージ内では domain だけ。application、analytics、indexing
    は adapters、interfaces、bootstrap を import しない(例外:`application/engine.py` だけは bootstrap
    を import してよい)。adapters は application、analytics、indexing、interfaces、bootstrap
    を import しない。interfaces/cli はパッケージ内では application.engine、domain、interfaces.cli
    だけ。bootstrap は制限しない。domain 以外では第三者ライブラリを制限しない。`tests/unit/test_import_boundaries.py`
    は、src/market_research_engine に対して find_violations が空になることを確かめる。'
  acceptance:
  - '`uv run python scripts/check_imports.py src/market_research_engine` が終了コード 0
    で終わる'
  - 一時ディレクトリの `domain/x.py` が httpx を import していると終了コード 1 になり、出力に `domain/x.py` が含まれる
  - '`adapters/sources/z.py` からの相対 import `from ...application import w` が違反として検出される'
  - '`application/engine.py` が bootstrap を import しても違反にならず、`application/other.py`
    からの import は違反になる'
  - '`interfaces/cli/main.py` が adapters を import すると違反になる'
  depends_on:
  - T-002
  size: S
  human_check: ''
  status: todo
- id: T-004
  title: ソースの記述と CollectionSpec
  milestone: M0
  request: '詳細設計の「F-01」「F-13」による。T-002 の DomainModel と UtcDatetime を使う。(1) `domain/source.py`:SourceCapabilities{periodic,
    search, batch, metrics_refresh, supports_region: bool}、SourceRights{license, attribution_required:
    bool, retention_policy, redistribution_policy, eligible_use, documentation_url,
    last_reviewed_at: str}、SourceDescriptor{source_id, display_name, adapter_version,
    docs_url, capabilities, rights, categories: tuple[str, ...]}。(2) `domain/collection.py`:CollectionMode=Literal[periodic,
    metrics_refresh, search]。CollectionBudget{max_requests: int|None(1 以上), timeout_sec:
    float|None(0 より大きい)}。CollectionSpec{source_id, mode, window_start と window_end:
    UtcDatetime|None, max_items: int|None, categories と query_terms と target_external_ids:
    tuple[str, ...]=(), sort_mode: str|None=None, budget: CollectionBudget|None=None,
    collection_version: str=''1'', resume_cursor: dict[str, JsonValue]|None=None}。設定値との照合はここでは行わない(T-033
    で行う)。`compute_panel_key(spec) -> str`:{source_id, mode, categories, query_terms,
    sort_mode, max_items, collection_version} を json.dumps(sort_keys=True, separators=('','',
    '':''), ensure_ascii=False) にした文字列の sha256 の先頭 16 hex に `pnl_` を付ける。'
  acceptance:
  - 各型で model_dump_json → model_validate_json が一致する
  - 未知のフィールドを渡すと ValidationError になる
  - CollectionBudget(max_requests=0) と CollectionBudget(timeout_sec=0) が ValidationError
    になる
  - compute_panel_key は、窓、budget、resume_cursor、target_external_ids を変えても同じ値を返す
  - compute_panel_key は categories か max_items を変えると別の値を返し、`^pnl_[0-9a-f]{16}$` の形になる
  depends_on:
  - T-002
  size: S
  human_check: ''
  status: todo
- id: T-005
  title: 収集の生データ、Coverage、run の型
  milestone: M0
  request: '詳細設計の「F-11」「F-12」「F-13」による。次の Literal を置く:`domain/record.py` の ContentType=Literal[hn_story,
    hn_comment, github_repository, github_issue]、`domain/evidence.py` の ClaimKind=Literal[observed_metric,
    reported_statement, documented_attribute]。`domain/collection.py` に次を足す。RawStatement{claim_kind:
    ClaimKind, text, source_locator}。RawMetric{name, value: float|None, unit}。RawRecord{source_id,
    external_id, content_type: ContentType, title: str|None, source_url, author: str|None,
    published_at: UtcDatetime|None, parent_external_id: str|None, excerpt: str|None,
    excerpt_truncated: bool, statements: tuple[RawStatement, ...], metrics: tuple[RawMetric,
    ...], source_topics: tuple[str, ...], dimensions: dict[str, JsonValue]}。Coverage{endpoint,
    requested_at, max_items: int|None, fetched_count, fetched_ids: tuple[str, ...],
    missing_items, rejected_items, out_of_window: int, timeout: bool, result_cap_hit:
    bool, stopped_reason: str|None, notes: tuple[str, ...]}。CollectionProgress は pydantic
    ではない可変のクラスで、Coverage の fetched_count 以降と同じ名前の属性(初期値は 0、空、False、None。fetched_ids
    と notes は list[str])と `cursor: dict[str, Any]|None` を持ち、`to_coverage(endpoint:
    str, requested_at: datetime, max_items: int|None) -> Coverage` を持つ。CollectionRun{run_id,
    job_id, source_id, mode, panel_key, status: Literal[running, completed, partial,
    failed], spec: CollectionSpec, started_at, finished_at: UtcDatetime|None, coverage:
    Coverage|None, error: ErrorInfo|None}。'
  acceptance:
  - RawRecord、Coverage、CollectionRun で model_dump_json → model_validate_json が一致する
  - CollectionProgress() をそのまま to_coverage したとき、件数が 0、timeout と result_cap_hit が False、notes
    が空になる
  - RawRecord の content_type に未知の値を渡すと ValidationError になる
  - RawRecord の published_at は None を受け付け、naive な datetime では ValidationError になる
  depends_on:
  - T-004
  size: S
  human_check: ''
  status: todo
