    str, topic_candidates, search_terms, counter_terms: list[str](各 5 個以下), regions:
    list[str], lookback_days: int|None, tasks: list[str]}(LLM の出力。intent と tasks はサーバー側で検証するので、任意の文字列を受け付ける)。ResearchPlan{intent:
    Intent, tasks: tuple[TaskKind, ...], topic_candidates、search_terms、counter_terms、regions:
    tuple[str, ...], lookback_days: int, fallback_used: bool}。パッケージ直下から ResearchQuery
    と ReadPolicy を再 export する。'
  acceptance:
  - ResearchQuery(question='   ') が ValidationError になり、'  abc ' は 'abc' として保持される
  - 2001 文字の question が ValidationError になる
  - regions に 'jp' を含むとき、または 11 個のとき ValidationError になる
