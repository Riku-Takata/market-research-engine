    facts, evidence) -> ValidatedAnswer`(dataclass:findings、unknowns、validation: ValidationSummary)。規則:存在しない
    ID を引用した finding、引用のない finding を捨てる。statement から正規表現 `\d[\d,.]*%?` で取った数字(カンマと末尾のピリオドを除く)のうち測定値として読めるものが、引用した
    Fact の display_values、引用した Evidence の excerpt、質問文から同じ方法で取った数字のどれにも当たらなければ捨てる。測定値として扱わず照合しないもの:年(19xx・20xx
    の4桁で % や小数点が付かないもの)と ISO 8601 の日付・時刻の一部、期間の長さ(直後に 日・日間・週・週間・か月・ヶ月・day(s)・week(s)・month(s)
    が続く数字)、行頭の箇条書きの番号(`^\s*\d+[.)、]\s`)。intent が hypothesis_evidence で contradicts
    が 1 件もなければ、unknowns に「反証は見つからなかった。反証がないことは支持の確定ではない」を足す。捨てた件数と理由(`unknown_id`、`no_citation`、`unsupported_number`)を
    validation に入れる。'
  acceptance:
  - 存在しない evidence_id を引用した finding が捨てられ、reasons に `unknown_id` が入る
  - 引用のない finding が捨てられ、reasons に `no_citation` が入る
  - Fact の display_values にない数字 `42%` を含む finding が捨てられ、`unsupported_number` が入る
  - display_values の `12.5%` と同じ数字を含む finding は残る
  - hypothesis_evidence で contradicts が 0 件のとき、unknowns に上の文が入る
  - synthesize の messages の user に TAG_EVIDENCE のブロックがあり、Evidence の抜粋がその中に入っている
  - 「2026年の直近7日間で」のように年と期間の長さだけを含む finding は捨てられない
  - 行頭が「1. 」の箇条書きの finding は、番号を理由に捨てられない
  - 質問文にある数字 `30` を含む finding は捨てられない
